name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# The release a tag makes is written with the workflow's token.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # An Intel runner: the app is pure Go, so it builds both architectures
    # from either, and the arm64 runners queue far longer.
    runs-on: macos-15-intel
    env:
      # Set these to sign and notarize the app for other Macs:
      #   gh secret set MACOS_SIGNING_IDENTITY   # "Developer ID Application: Your Name (TEAMID)"
      #   gh secret set MACOS_CERT_P12          < cert.p12 | base64
      #   gh secret set MACOS_CERT_PASSWORD
      #   gh secret set MACOS_NOTARY_APPLE_ID / MACOS_NOTARY_TEAM_ID / MACOS_NOTARY_PASSWORD
      SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check
        run: |
          gofmt -l . | tee /tmp/fmt
          test ! -s /tmp/fmt
          go vet ./...
          go tool mygo vet .
          go test -timeout 180s ./...

      - name: Import signing certificate
        if: env.SIGN_IDENTITY != ''
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,codesign: \
            -s -k actions build.keychain
          rm /tmp/cert.p12

      - name: Build
        env:
          # Signs the update archive and writes the update manifest with it:
          #   go tool mygo keygen   # once, locally
          #   gh secret set MYGO_UPDATER_PRIVATE_KEY < path/to/mygo-update.key
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          # Delta updates download the published archives.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$SIGN_IDENTITY" ]; then
            go tool mygo build -platform darwin/universal -sign "$SIGN_IDENTITY"
          else
            go tool mygo build -platform darwin/universal
          fi

      - name: Verify update files
        if: startsWith(github.ref, 'refs/tags/v')
        run: test -f build/darwin-universal/update-darwin-universal.json

      - name: Verify signature
        run: codesign --verify --deep --strict --verbose=2 build/darwin-universal/FundBar.app

      - uses: actions/upload-artifact@v7
        with:
          name: FundBar-macos
          if-no-files-found: error
          path: |
            build/darwin-universal/*.dmg
            build/darwin-universal/*.tar.gz
            build/darwin-universal/update-*.json
            build/darwin-universal/*.delta
            build/darwin-universal/*.app

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
          # The archive and the manifest are what installed apps update from,
          # and they read them from the latest release: upload all of them.
          files: |
            build/darwin-universal/*.dmg
            build/darwin-universal/*.tar.gz
            build/darwin-universal/update-*.json
            build/darwin-universal/*.delta
